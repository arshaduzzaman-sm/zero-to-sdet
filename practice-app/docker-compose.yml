# The whole Practice App: the shop, its three databases and Mailpit.
# For practice on your own computer (or your own GitHub Codespace) only.
#
#   docker compose up -d      start everything, then open http://127.0.0.1:8080
#                             (the first start downloads and builds, a few minutes)
#   docker compose down       stop (your data stays)
#   docker compose down -v    stop and delete all data
#   docker compose exec app python -m bookshelf reset    back to the seed data
#
# Every port listens on 127.0.0.1 only, so other computers cannot reach it.
# Passwords come from .env (copy .env.example); the defaults are fake.
# Images are pinned to an exact version and digest, so they never change by surprise.

name: bookshelf

services:
  app:
    build: .
    image: bookshelf-app:1.0.0
    environment:
      # Inside the container the app must listen on 0.0.0.0. That is safe only
      # because the port below is published on 127.0.0.1. Keep both as they are.
      HOST: 0.0.0.0
      CONTAINER_PORT_IS_LOCAL_ONLY: "yes"
      DATABASE_URL: postgresql+psycopg://bookshelf:${POSTGRES_PASSWORD:-local_only_password}@postgres:5432/bookshelf
      REPORTING_DATABASE_URL: mysql+pymysql://bookshelf:${MYSQL_PASSWORD:-local_only_password}@mysql:3306/reporting
      MONGODB_URL: mongodb://bookshelf:${MONGO_PASSWORD:-local_only_password}@mongo:27017/?authSource=admin
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SECRET_KEY: ${SECRET_KEY:-}
      TOKEN_MINUTES: ${TOKEN_MINUTES:-30}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-Test@1234}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-local_only_password}
      FAKE_CUSTOMERS: ${FAKE_CUSTOMERS:-40}
      REPORTING_SYNC_SECONDS: ${REPORTING_SYNC_SECONDS:-60}
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-3}
      CLOCK_CONTROL: ${CLOCK_CONTROL:-on}
      PRACTICE_APP_BUGS: ${PRACTICE_APP_BUGS:-on}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    environment:
      POSTGRES_DB: bookshelf
      POSTGRES_USER: bookshelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshelf -d bookshelf"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: reporting
      MYSQL_USER: bookshelf
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_only_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_only_root_password}
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u bookshelf -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  mongo:
    image: mongo:8.0.38@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
    environment:
      MONGO_INITDB_ROOT_USERNAME: bookshelf
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-local_only_password}
    ports:
      - "127.0.0.1:57017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Catches every email the app sends; nothing reaches a real inbox.
  # Read them at http://127.0.0.1:58025 (or with its API: /api/v1/messages).
  # Emails live in memory only: they are gone after a restart.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_MAX_MESSAGES: 500
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    ports:
      - "127.0.0.1:58025:8025" # web page and API
      - "127.0.0.1:51025:1025" # SMTP: the app sends emails here
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  app-data:
  postgres-data:
  mysql-data:
  mongo-data:
