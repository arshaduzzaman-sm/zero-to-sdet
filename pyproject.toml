# Settings for the code tools. Not a Python package: there is nothing to install from here.
# Tools are pinned in requirements.txt (with hashes).

[tool.pytest.ini_options]
testpaths = ["modules", "_new_topic_template/modules", "scripts/tests", "practice-app/tests"]
# The Practice App package (practice-app/bookshelf) is imported by its own tests.
pythonpath = ["practice-app"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
# Test files inside templates/ and examples/ are for readers to copy. They run
# through each topic's tests/ (in a subprocess, the way a reader runs them),
# so pytest does not collect them directly.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "templates", "examples", "exercises", "solutions"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Markdown is not formatted: it would break snippet lines such as --8<-- "file.py".
extend-exclude = [
  "*.md",
  # Mistakes on purpose: the static analysis lesson shows Ruff finding them.
  "modules/think_like_a_tester/static_testing_and_reviews/examples/static_analysis/test_cart_mistakes.py",
]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle: layout
  "F",       # pyflakes: real bugs (unused names, undefined names)
  "I",       # import order
  "B",       # bugbear: likely mistakes
  "UP",      # modern Python syntax
  "SIM",     # simpler code
  "N",       # naming
  "S",       # bandit: security problems
]

[tool.ruff.lint.isort]
# The Practice App package, so its imports sort as "ours" from any folder.
known-first-party = ["bookshelf"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert on purpose (that is how pytest works).
"**/tests/**" = ["S101"]
# behave step definitions are tests too: a failed assert is a failed step.
"**/features/steps/**" = ["S101"]
# Scripts call git with fixed arguments, never with user input.
"scripts/**" = ["S603", "S607"]
# One-off research scripts: long lines are regex patterns and data, easier to read unwrapped.
"scripts/research/**" = ["E501"]
# Exercise starting points keep the imports the answer needs, as a hint.
"modules/**/exercises/*.py" = ["F401"]
# The Practice App's tests type the fake seeded passwords on purpose.
"practice-app/tests/**" = ["S101", "S105", "S106"]
# Test templates and examples use plain assert, like every pytest test.
"modules/**/test_*.py" = ["S101"]
# Topic tests run a template with pytest in a subprocess, with fixed arguments.
"modules/**/tests/**" = ["S101", "S603"]
