name: Template or code problem
description: A template, example or exercise does not run, or gives a different result than the page shows.
title: "Code: "
labels: ["code"]
body:
  - type: markdown
    attributes:
      value: |
        Before you paste any output, remove passwords, tokens, your username,
        your computer name and personal paths (for example /Users/yourname/...).
  - type: input
    id: template
    attributes:
      label: Which template or page?
      placeholder: modules/core_automation/api_testing/templates/... or the page address
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What did you run?
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What did you see?
      description: The full error message, from the first line to the last.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Your system
      placeholder: macOS 15, Python 3.13.1
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, tokens, usernames and personal paths from what I pasted.
          required: true
