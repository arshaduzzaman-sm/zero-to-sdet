# Runs locally before every commit. Install once with: pre-commit install
# ruff and the other checks from PROJECT_BRIEF.md step 1.12 are added later.
minimum_pre_commit_version: "4.0.0"

repos:
  # Blocks any commit that contains a password, key or token.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Small safety checks that cost nothing.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # Pinned third-party files must stay byte-for-byte as published (their hash is checked).
        exclude: ^docs/assets/javascripts/vendor/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        # Pinned third-party files must stay byte-for-byte as published (their hash is checked).
        exclude: ^docs/assets/javascripts/vendor/
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        # Pinned third-party files must stay byte-for-byte as published (their hash is checked).
        exclude: ^docs/assets/javascripts/vendor/

  # The menu and section overview pages are built from page front matter.
  # This stops a commit if someone forgot to run the generator.
  - repo: local
    hooks:
      - id: build-nav
        name: menu and overview pages are up to date
        entry: .venv/bin/python scripts/build_nav.py --check
        language: system
        pass_filenames: false
        files: ^(docs/.*\.md|zensical\.toml|README\.md|scripts/build_nav\.py)$
      - id: build-reference
        name: glossary, tags and hover explanations are up to date
        entry: .venv/bin/python scripts/build_reference.py --check
        language: system
        pass_filenames: false
        files: ^(docs/.*\.md|data/.*\.yml|includes/.*|scripts/build_(nav|reference)\.py)$
      - id: build-template-index
        name: the template index lists every template
        entry: .venv/bin/python scripts/build_template_index.py --check
        language: system
        pass_filenames: false
        files: ^(modules/.*/templates/.*|docs/.*\.md|scripts/build_(nav|template_index)\.py)$
      - id: credit-lines
        name: every template starts with the credit line
        entry: .venv/bin/python scripts/check_credit_lines.py
        language: system
        pass_filenames: false
        files: (^|/)templates/|^scripts/check_credit_lines\.py$
      # Python lint and format. Uses the ruff pinned (with hashes) in requirements.txt,
      # so pre-commit and scripts/check.sh always run the same version.
      - id: ruff-check
        name: ruff check (Python lint and security rules)
        entry: .venv/bin/ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format (Python formatting)
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi]
